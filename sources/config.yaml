autohintOTF: false
autohintTTF: false
axisOrder:
  - wght
buildSmallCap: false
buildStatic: true
buildVariable: true
decomposeTransformedComponents: true
familyName: Giphurs Mono
outputDir: '../fonts'
includeSourceFixes: true
sources:
  - GiphursMono.designspace
stat:
  GiphursMono[wght].ttf:
  - name: Weight
    tag: wght
    values:
    - name: Regular
      value: 400
      linkedValue: 700
      flags: 2
    - name: Medium
      value: 500
    - name: SemiBold
      value: 600
    - name: Bold
      value: 700
    - name: ExtraBold
      value: 800
    - name: Black
      value: 900
    - name: ExtraBlack
      value: 1000

